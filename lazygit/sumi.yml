# Sumi for lazygit, part of cosmic-sumi-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/sumi.yml and
# zsh/sumi.zsh sets LG_CONFIG_FILE to "config.yml,sumi.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/sumi.yml"
gui:
  theme:
    activeBorderColor:
      - "#8B9388"
      - bold
    inactiveBorderColor:
      - "#5F5D58"
    searchingActiveBorderColor:
      - "#E07969"
      - bold
    optionsTextColor:
      - "#75897F"
    selectedLineBgColor:
      - "#1E1E1E"
    inactiveViewSelectedLineBgColor:
      - "#111111"
    cherryPickedCommitFgColor:
      - "#050505"
    cherryPickedCommitBgColor:
      - "#C2A46D"
    markedBaseCommitFgColor:
      - "#050505"
    markedBaseCommitBgColor:
      - "#9FA89C"
    unstagedChangesColor:
      - "#DA614E"
    defaultFgColor:
      - "#D6D0C5"
  authorColors:
    "*": "#C2A46D"
