# Sumi colour scheme for qt5ct / qt6ct, part of cosmic-sumi-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Sumi, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#d6d0c5, #111111, #5f5d58, #2a2a2a, #030303, #1e1e1e, #d6d0c5, #fff9ed, #d6d0c5, #030303, #050505, #030303, #8b9388, #050505, #8b9388, #8b9388, #111111, #050505, #111111, #d6d0c5, #817e77
disabled_colors=#5f5d58, #111111, #5f5d58, #2a2a2a, #030303, #1e1e1e, #5f5d58, #75897f, #5f5d58, #050505, #050505, #030303, #5f5d58, #75897f, #817e77, #817e77, #111111, #050505, #111111, #d6d0c5, #5f5d58
inactive_colors=#d6d0c5, #111111, #5f5d58, #2a2a2a, #030303, #1e1e1e, #d6d0c5, #fff9ed, #d6d0c5, #030303, #050505, #030303, #8b9388, #050505, #8b9388, #8b9388, #111111, #050505, #111111, #d6d0c5, #817e77
